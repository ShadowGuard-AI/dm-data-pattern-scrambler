<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The dispersed library in three bands: shelves fixed while window light drifts across the spines in the far band, ribbon bookmarks swaying and one slipping farther out in the middle band, and a hand at the frame edge turning index tabs one at a time in the near band">
